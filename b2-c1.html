const bank=[["Café","«No es que el servicio sea malo, sino que hoy van desbordados». ¿Qué matiz introduce?",["Corrige una valoración negativa","Confirma que el servicio es malo","Atribuye la demora al cliente"],0,"B2"],["Café","«¿Te importaría que nos cambiaran de mesa?» expresa...",["Una petición indirecta y cortés","Una obligación contractual","Una queja formal ya presentada"],0,"B2"],["Café","«El precio no se corresponde en absoluto con lo que ofrecen». ¿Qué comunica?",["Una crítica a la relación calidad-precio","Una duda sobre el horario","Una petición de descuento estudiantil"],0,"C1"],["Café","«Por mucho que se esmeren, difícilmente compensarán la espera». ¿Qué expresa?",["Escepticismo pese al esfuerzo","Confianza plena en el servicio","Una condición ya cumplida"],0,"C1"],["Metro","«A no ser que haya incidencias, llegaremos puntuales». ¿Qué significa?",["La puntualidad depende de que no haya problemas","Llegarán tarde con seguridad","Las incidencias ya han terminado"],0,"B2"],["Metro","«Nos habríamos ahorrado el transbordo de haber cogido la otra línea». ¿Qué expresa?",["Una alternativa hipotética pasada","Una instrucción presente","Una predicción segura"],0,"B2"],["Metro","«La avería ha trastocado por completo mis planes». ¿Qué significa «trastocado»?",["Alterado considerablemente","Confirmado definitivamente","Acelerado ligeramente"],0,"C1"],["Metro","«No bien anunciaron el retraso, se llenó el andén». ¿Cuándo ocurrió?",["Inmediatamente después del anuncio","Antes de que existiera el retraso","Mucho después del anuncio"],0,"C1"],["Piso","«Me gustaría que se hiciera constar la avería en el contrato». ¿Qué pide?",["Que el problema quede documentado","Que se anule el contrato sin más","Que suba la renta"],0,"B2"],["Piso","«Siempre y cuando reparen la caldera, renovaré». ¿Qué expresa?",["Una condición necesaria","Una promesa incondicional","Un hecho ya ocurrido"],0,"B2"],["Piso","«El propietario ha hecho oídos sordos a nuestras reclamaciones». ¿Qué significa?",["Ha ignorado las quejas","Ha aceptado las peticiones","Ha pedido disculpas"],0,"C1"],["Piso","«La cláusula resulta ambigua y se presta a interpretaciones». ¿Qué implica?",["Puede entenderse de más de una manera","Es inequívoca","Carece de relevancia legal"],0,"C1"],["Amigos","«Aunque me apetezca salir, mañana madrugo». ¿Qué comunica?",["Un deseo que contrasta con una limitación","Una salida ya confirmada","Una falta total de interés"],0,"B2"],["Amigos","«Si me hubieras avisado, habría ido». ¿Qué expresa?",["Una oportunidad pasada no realizada","Una obligación futura","Un hábito presente"],0,"B2"],["Amigos","«No me hizo mucha gracia que lo contara delante de todos». ¿Qué implica?",["Le molestó que lo divulgara","Le pareció divertidísimo","No entendió el chiste"],0,"C1"],["Amigos","«Por más vueltas que le doy, no encuentro cómo decírselo». ¿Qué expresa?",["Dificultad persistente pese a reflexionar","Falta de interés por hablar","Una decisión definitiva de callar"],0,"C1"],["Trabajo","«Buscamos a alguien que sepa desenvolverse bajo presión». ¿Qué valoran?",["Capacidad de actuar eficazmente en situaciones exigentes","Disponibilidad para viajar","Experiencia en ventas"],0,"B2"],["Trabajo","«En caso de que me seleccionen, podría incorporarme el lunes». ¿Qué expresa?",["Una posibilidad condicionada","Una contratación confirmada","Una renuncia"],0,"B2"],["Trabajo","«Conviene matizar las cifras antes de sacar conclusiones precipitadas». ¿Qué aconseja?",["Interpretar los datos con cautela","Publicarlos inmediatamente","Descartar todas las cifras"],0,"C1"],["Trabajo","«Lejos de solucionar el problema, la medida lo ha agravado». ¿Qué significa?",["La medida empeoró la situación","La medida lo resolvió","La medida no tuvo ningún efecto"],0,"C1"],["Médico","«El dolor se intensifica después de comer, aunque luego remite». ¿Qué ocurre?",["Empeora y después disminuye","Desaparece permanentemente","Sólo aparece al despertar"],0,"B2"],["Médico","«Me preocupa que los retortijones no hayan remitido». ¿Qué significa?",["Que los cólicos continúan","Que la fiebre ha bajado","Que ya no siente molestias"],0,"B2"],["Médico","«No sabría precisar el origen, pero el malestar se ha ido agudizando». ¿Qué indica?",["Que las molestias empeoran progresivamente","Que ya conoce la causa","Que el dolor ha desaparecido"],0,"C1"],["Médico","«De persistir los síntomas, vuelva para una valoración». ¿Qué expresa?",["Una condición para regresar","Una prohibición de volver","Una cita ya realizada"],0,"C1"],["Farmacia","«¿Sería posible encargarlo y avisarme cuando llegue?». ¿Qué solicita?",["Una reserva y notificación","Un cambio inmediato de dosis","Una devolución de receta"],0,"B2"],["Farmacia","«Preferiría consultarlo con mi médico antes de aceptar un sustituto». ¿Qué expresa?",["Una cautela ante el cambio de medicamento","Un rechazo de toda atención médica","Una solicitud de duplicar el tratamiento"],0,"B2"],["Farmacia","«El suministro está siendo irregular y no podemos garantizar una fecha». ¿Qué comunica?",["Incertidumbre sobre la reposición","Disponibilidad inmediata","Retirada definitiva del producto"],0,"C1"],["Farmacia","«Agradecería que comprobara si existe una presentación equivalente». ¿Qué pide?",["Verificar una alternativa comparable","Modificar por su cuenta la prescripción","Cancelar todos los medicamentos"],0,"C1"],["Colegio","«No pretendo justificar su conducta, sino entender qué la desencadenó». ¿Qué expresa?",["Deseo de conocer la causa sin excusar el comportamiento","Negación del incidente","Una exigencia de expulsión"],0,"B2"],["Colegio","«Le agradecería que me mantuviera al tanto de cualquier novedad». ¿Qué pide?",["Información continuada","Una reunión semanal obligatoria","Un cambio de profesor"],0,"B2"],["Colegio","«Sería contraproducente sancionarlo sin escuchar antes su versión». ¿Qué sostiene?",["Que castigar sin oírlo podría empeorar las cosas","Que ninguna sanción es posible","Que el incidente está inventado"],0,"C1"],["Colegio","«Convendría abordar el asunto sin prejuzgar a ninguna de las partes». ¿Qué propone?",["Tratarlo con imparcialidad","Atribuir la culpa al alumno","Evitar toda conversación"],0,"C1"],["Policía","«Aunque no esté de acuerdo, colaboraré con el procedimiento». ¿Qué expresa?",["Cooperación pese al desacuerdo","Negativa a someterse a la prueba","Admisión de haber bebido"],0,"B2"],["Policía","«¿Podría indicarme cuáles son los siguientes pasos?». ¿Qué solicita?",["Una explicación del procedimiento","Una reducción de la velocidad","Una autorización para marcharse"],0,"B2"],["Policía","«Quisiera dejar constancia de mi disconformidad sin obstaculizar la actuación». ¿Qué quiere?",["Registrar su desacuerdo mientras coopera","Impedir la intervención","Reconocer una infracción"],0,"C1"],["Policía","«El agente le insta a que permanezca en el vehículo». ¿Qué significa «insta»?",["Le requiere que lo haga","Le permite elegir libremente","Le informa de que ya puede irse"],0,"C1"]];
let qs=[];function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}function buildQuiz(){qs=[];for(const cat of ['Café','Metro','Piso','Amigos','Trabajo','Médico','Farmacia','Colegio','Policía']){for(const level of ['B2','C1']){const pool=shuffle(bank.filter(q=>q[0]===cat&&q[4]===level).slice());qs.push(...pool.slice(0,2))}}}
let streak=0;let i=0,score=0,correctC1=0,correctB2=0,totalC1=0,totalB2=0,locked=false;
const app=document.getElementById('app');const icons=['☕','🚇','🏠','💃','💼','🩺','💊','🏫','🚔'];const quips=['¡Ojo! En Madrid, el café es cosa seria.','No te duermas, que se va el Metro.','El casero dice que todo está perfecto… claro.','Cuidado: las cañas pueden durar seis horas.','Respira. La entrevista no muerde.','El doctor pregunta qué comiste. No digas «todo».','La farmacia está sin existencias. Pacito dice: ¡no cambies la dosis por tu cuenta!','La directora te mira. Tú respiras.','Pacito dice: calma, educación y nada de bromas sobre el alcohol.'];function map(){return '<div class="map">'+icons.map((x,j)=>'<div class="stop '+(Math.floor(i/4)===j?'active':'')+'">'+x+'</div>').join('')+'</div>'}function guide(){return '<div class="guide"><span class="face"><img src="pacito.png" alt="Pacito" style="width:56px;height:56px;object-fit:cover;border-radius:50%" onerror="this.outerHTML=String.fromCodePoint(129489,127995,8205,127912)"></span><p><b>Tu guía, Pacito:</b> '+quips[Math.min(8,Math.floor(i/4))]+'</p></div>'}
function start(){buildQuiz();streak=0;i=0;score=0;correctC1=0;correctB2=0;totalC1=0;totalB2=0;show();}
function welcome(){app.innerHTML='<section class="card"><p class="tag">Spanish adventure · B2/C1 · Demo MVP</p><h1>¡Sobrevive en Madrid! 🎮</h1><p>Nine Madrid adventures: from café chaos to a prescription shortage, school and a police stop. Can your Spanish survive?</p><p>36 questions selected from a B2/C1 question bank · about 12–15 minutes · a short B2/C1 report.</p><p class="small">No login. Just you, Madrid and a little linguistic drama.</p><button class="btn accent" onclick="start()">¡Vamos! →</button></section>'}
function show(){locked=false;if(i>=qs.length)return report();let q=qs[i];let options=shuffle(q[2].map((v,j)=>({v,j})));
app.innerHTML=map()+guide()+'<div class="stats"><span>⭐ '+score+' XP</span><span>Pregunta '+(i+1)+' / '+qs.length+'</span></div><div class="bar"><div class="fill" style="width:'+(100*i/qs.length)+'%"></div></div><section class="card"><p class="tag">📍 '+q[0]+' · '+q[4]+'</p><h2>'+q[1]+'</h2><div id="answers"></div><div id="response" aria-live="polite"></div></section>';const box=document.getElementById('answers');options.forEach(o=>{let b=document.createElement('button');b.className='btn answer';b.textContent=o.v;b.onclick=()=>choose(o.j,b);box.appendChild(b)})}
function choose(j,button){if(locked)return;locked=true;let q=qs[i],ok=j===q[3];if(q[4]==='C1'){totalC1++;if(ok)correctC1++}else{totalB2++;if(ok)correctB2++}if(ok){streak++;score+=10+(streak>=3?5:0)}else streak=0;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===q[2][q[3]])b.classList.add('correct')});if(!ok)button.classList.add('wrong');document.getElementById('response').innerHTML='<div class="feedback">'+(ok?(['🎉 ¡Olé! Muy bien.','💃 ¡Qué arte tienes!','👏 ¡Bravo! Pacito está impresionado.','☀️ ¡Así se habla! Pacito te da un diez.','🥳 ¡Perfecto! Sigue con esa energía.'][Math.floor(Math.random()*5)]+(streak>=3?' 🔥 Racha de '+streak+' — +15 XP':' +10 XP')):(['😅 ¡Casi! Hasta Pacito se equivoca a veces.','🤭 ¡Uy! Pacito cree que esa respuesta se ha subido al Metro equivocado.','🧠 ¡Buen intento! La próxima cae.','☕ Pacito recomienda un café y otra pregunta.','🚀 ¡Sin drama! Aprender también es equivocarse.','🙃 ¡Vaya! Pacito te advierte: esta pregunta tenía trampa.'][Math.floor(Math.random()*6)]+' Respuesta correcta: '+q[2][q[3]]+'.'))+'</div><button class="btn accent" onclick="next()">'+(i===qs.length-1?'Ver mi informe 📊':'Siguiente →')+'</button>'}
function next(){i++;if(i<qs.length&&[4,12,20,28,32].includes(i)){let lines=['☕ ¡Primer barrio superado! Pacito te invita a un café imaginario.','🏠 ¡Vas genial! Tu español ya encuentra piso… casi.','💼 ¡Mitad de aventura! Sigue así: hasta el Metro te aplaude.','💊 ¡Qué soltura! Hasta el farmacéutico te pide consejos.','🏫 ¡Recta final! La directora ya te trata de usted.'];let n=[4,12,20,28,32].indexOf(i);app.innerHTML='<section class="card" style="text-align:center"><div style="font-size:64px">🎉</div><p class="tag">Mensaje de Pacito · B2/C1</p><h2>'+lines[n]+'</h2><p>⭐ '+score+' XP · '+i+' de '+qs.length+' retos completados</p><button class="btn accent" onclick="show()">¡Seguimos! →</button></section>';}else show()}
function report(){let c1=totalC1?Math.round(100*correctC1/totalC1):0,b2=totalB2?Math.round(100*correctB2/totalB2):0;let level=b2<60?'Below B2 (indicative)':c1>=80&&b2>=80?'C1 (indicative)':c1>=55&&b2>=70?'B2+ / approaching C1':'B2 (indicative)';let advice=b2<60?'Practise interpreting nuanced meanings, formal requests and complex structures.':'Keep developing sophisticated argumentation, register and idiomatic language.';window.summary='CarpeMadrid B2/C1 Spanish Adventure\nResult: '+level+'\nXP: '+score+'/'+(qs.length*10)+'\nC1: '+c1+'%\nB2: '+b2+'%\nNext step: '+advice+'\nNot an official CEFR assessment.';app.innerHTML='<section class="card"><p class="tag">Tu informe · B2/C1 · Game complete</p><h1>🏆 ¡Enhorabuena!</h1><p>Has sobrevivido a Madrid sin perder el abono transporte. ¡Eso ya es algo!</p><p class="badge">'+level+'</p><h2>'+score+' XP</h2><p><b>C1 questions:</b> '+c1+'% correct<br><b>B2 questions:</b> '+b2+'% correct</p><h2>Medallas de Madrid</h2><div class="badgeboard"><span>☕ Café valiente</span><span>🚇 Metro survivor</span><span>🏠 Piso detective</span><span>💃 Rey de las cañas</span><span>💼 Entrevista ninja</span><span>🩺 Paciente paciente</span><span>💊 Receta resuelta</span><span>🏫 Reunión superada</span><span>🚔 Control con calma</span></div><h2>Your short report</h2><p><b>Strength:</b> '+(b2>=70?'Understanding nuanced Spanish in everyday situations.':'Continue developing confident upper-intermediate comprehension.')+'</p><p><b>Next step:</b> '+advice+'</p><p class="small">This is a fun reading, grammar and vocabulary sample, not a validated CEFR placement test. It does not assess speaking, listening or writing.</p><button class="btn accent" onclick="share()">📤 Share my report</button><button class="btn" onclick="welcome()">↻ Play again</button><p><a class="btn accent" style="display:block;text-align:center;text-decoration:none" href="https://carpemadrid.com" target="_blank" rel="noopener">🎓 Find out about our Spanish courses here →</a></p></section>'}
async function share(){try{if(navigator.share)await navigator.share({title:'My CarpeMadrid Spanish result',text:window.summary});else if(navigator.clipboard){await navigator.clipboard.writeText(window.summary);alert('Report copied!')}else prompt('Copy your report',window.summary)}catch(e){if(e.name!=='AbortError')prompt('Copy your report',window.summary)}}
try{welcome()}catch(err){document.getElementById("app").insertAdjacentHTML("beforeend", "<p role=\"alert\">Game error: "+String(err.message)+"</p>");}
</script></body></html>

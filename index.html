l lunes» indica...",["Una posibilidad condicionada","Una certeza sobre el pasado","Una negativa"],0,"B2"],["Médico","«Tengo náuseas desde anoche» significa...",["Siento ganas de vomitar","Me duele la espalda","Tengo tos"],0,"B1"],["Médico","«El dolor viene y va» significa...",["Es intermitente","Es constante","Ya ha desaparecido"],0,"B1"],["Médico","«Me preocupa que pueda ser algo más serio» expresa...",["Inquietud ante una posibilidad","Un diagnóstico confirmado","Una recuperación completa"],0,"B2"],["Médico","«A menos que empeore, no volveré a urgencias» indica...",["Una excepción que cambiaría el plan","Una visita obligatoria","Un hecho ya ocurrido"],0,"B2"],["Farmacia","«¿Me puede dispensar lo que aparece en esta receta?» significa...",["Pedir los medicamentos prescritos","Solicitar un diagnóstico","Comprar vitaminas sin receta"],0,"B1"],["Farmacia","«Está agotado hasta el jueves» significa...",["No habrá existencias antes del jueves","Caduca el jueves","Sólo se vende los jueves"],0,"B1"],["Farmacia","«¿Sería posible reservarlo para cuando llegue?» expresa...",["Una petición educada de reserva","Una reclamación de dinero","Una solicitud de cambiar el tratamiento"],0,"B2"],["Farmacia","«Antes de sustituirlo, preferiría consultarlo con mi médico» significa...",["Quiere confirmar el cambio con el prescriptor","Acepta cualquier sustitución","Quiere duplicar la dosis"],0,"B2"],["Colegio","«Su hija ha faltado al respeto a un compañero» significa...",["Se ha comportado de manera irrespetuosa","Ha faltado a clase","Ha suspendido un examen"],0,"B1"],["Colegio","«Queremos hablar de su conducta» significa...",["Conversar sobre su comportamiento","Entregar las notas","Organizar una excursión"],0,"B1"],["Colegio","«Me gustaría escuchar también su versión de los hechos» significa...",["Quiere conocer el relato del menor","Niega todo lo sucedido","Exige un castigo"],0,"B2"],["Colegio","«Si vuelve a ocurrir, acordaremos nuevas medidas» expresa...",["Una consecuencia condicionad const app=document.getElementById('app');const icons=['☕','🚇','🏠','💃','💼','🩺','💊','🏫','🚔'];const quips=['¡Ojo! En Madrid, el café es cosa seria.','No te duermas, que se va el Metro.','El casero dice que todo está perfecto… claro.','Cuidado: las cañas pueden durar seis horas.','Respira. La entrevista no muerde.','El doctor pregunta qué comiste. No digas «todo».','La farmacia está sin existencias. Pacito dice: ¡no cambies la dosis por tu cuenta!','La directora te mira. Tú respiras.','Pacito dice: calma, educación y nada de bromas sobre el alcohol.'];function map(){return '<div class="map">'+icons.map((x,j)=>'<div class="stop '+(Math.floor(i/4)===j?'active':'')+'">'+x+'</div>').join('')+'</div>'}function guide(){return '<div class="guide"><span class="face"><img src="pacito.png" alt="Pacito" style="width:56px;height:56px;object-fit:cover;border-radius:50%" onerror="this.outerHTML=String.fromCodePoint(129489,127995,8205,127912)"></span><p><b>Tu guía, Pacito:</b> '+quips[Math.min(8,Math.floor(i/4))]+'</p></div>'}
function start(){buildQuiz();streak=0;i=0;score=0;correctB1=0;correctB2=0;totalB1=0;totalB2=0;show();}
function welcome(){app.innerHTML='<section class="card"><p class="tag">Spanish adventure · B1/B2 · Demo MVP</p><h1>¡Sobrevive en Madrid! 🎮</h1><p>Nine Madrid adventures: from café chaos to a prescription shortage, school and a police stop. Can your Spanish survive?</p><p>36 questions selected at random from a bank of 72 · about 12–15 minutes · a short B1/B2 report.</p><p class="small">No login. Just you, Madrid and a little linguistic drama.</p><button class="btn accent" onclick="start()">¡Vamos! →</button></section>'}
function show(){locked=false;if(i>=qs.length)return report();let q=qs[i];let options=shuffle(q[2].map((v,j)=>({v,j})));
app.innerHTML=map()+guide()+'<div class="stats"><span>⭐ '+score+' XP</span><span>Pregunta '+(i+1)+' / '+qs.length+'</span></div><div class="bar"><div class="fill" style="width:'+(100*i/qs.length)+'%"></div></div><section class="card"><p class="tag">📍 '+q[0]+' · '+q[4]+'</p><h2>'+q[1]+'</h2><div id="answers"></div><div id="response" aria-live="polite"></div></section>';const box=document.getElementById('answers');options.forEach(o=>{let b=document.createElement('button');b.className='btn answer';b.textContent=o.v;b.onclick=()=>choose(o.j,b);box.appendChild(b)})}
function choose(j,button){if(locked)return;locked=true;let q=qs[i],ok=j===q[3];if(q[4]==='B1'){totalB1++;if(ok)correctB1++}else{totalB2++;if(ok)correctB2++}if(ok){streak++;score+=10+(streak>=3?5:0)}else streak=0;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===q[2][q[3]])b.classList.add('correct')});if(!ok)button.classList.add('wrong');document.getElementById('response').innerHTML='<div class="feedback">'+(ok?(['🎉 ¡Olé! Muy bien.','💃 ¡Qué arte tienes!','👏 ¡Bravo! Pacito está impresionado.','☀️ ¡Así se habla! Pacito te da un diez.','🥳 ¡Perfecto! Sigue con esa energía.'][Math.floor(Math.random()*5)]+(streak>=3?' 🔥 Racha de '+streak+' — +15 XP':' +10 XP')):(['😅 ¡Casi! Hasta Pacito se equivoca a veces.','🤭 ¡Uy! Pacito cree que esa respuesta se ha subido al Metro equivocado.','🧠 ¡Buen intento! La próxima cae.','☕ Pacito recomienda un café y otra pregunta.','🚀 ¡Sin drama! Aprender también es equivocarse.','🙃 ¡Vaya! Pacito te advierte: esta pregunta tenía trampa.'][Math.floor(Math.random()*6)]+' Respuesta correcta: '+q[2][q[3]]+'.'))+'</div><button class="btn accent" onclick="next()">'+(i===qs.length-1?'Ver mi informe 📊':'Siguiente →')+'</button>'}
function next(){i++;if(i<qs.length&&[4,12,20,28,32].includes(i)){let lines=['☕ ¡Primer barrio superado! Pacito te invita a un café imaginario.','🏠 ¡Vas genial! Tu español ya encuentra piso… casi.','💼 ¡Mitad de aventura! Sigue así: hasta el Metro te aplaude.','💊 ¡Qué soltura! Hasta el farmacéutico te pide consejos.','🏫 ¡Recta final! La directora ya te trata de usted.'];let n=[4,12,20,28,32].indexOf(i);app.innerHTML='<section class="card" style="text-align:center"><div style="font-size:64px">🎉</div><p class="tag">Mensaje de Pacito · B1/B2</p><h2>'+lines[n]+'</h2><p>⭐ '+score+' XP · '+i+' de '+qs.length+' retos completados</p><button class="btn accent" onclick="show()">¡Seguimos! →</button></section>';}else show()}
function report(){selectedNps=0;let b1=totalB1?Math.round(100*correctB1/totalB1):0,b2=totalB2?Math.round(100*correctB2/totalB2):0;let level=b1<60?'Below B1 (indicative)':b2>=80&&b1>=80?'B2 (indicative)':b2>=55&&b1>=70?'B1+ / approaching B2':'B1 (indicative)';let advice=b2<60?'Practise nuanced expressions, subjunctive and hypothetical structures.':'Keep practising real-world conversations and complex opinions.';window.summary='CarpeMadrid B1/B2 Spanish Adventure\nResult: '+level+'\nXP: '+score+'/'+(qs.length*10)+'\nB1: '+b1+'%\nB2: '+b2+'%\nNext step: '+advice+'\nNot an official CEFR assessment.';app.innerHTML='<section class="card"><p class="tag">Tu informe · Game complete</p><h1>🏆 ¡Enhorabuena!</h1><p>Has sobrevivido a Madrid sin perder el abono transporte. ¡Eso ya es algo!</p><p class="badge">'+level+'</p><h2>'+score+' XP</h2><p><b>B1 questions:</b> '+b1+'% correct<br><b>B2 questions:</b> '+b2+'% correct</p><h2>Medallas de Madrid</h2><div class="badgeboard"><span>☕ Café valiente</span><span>🚇 Metro survivor</span><span>🏠 Piso detective</span><span>💃 Rey de las cañas</span><span>💼 Entrevista ninja</span><span>🩺 Paciente paciente</span><span>💊 Receta resuelta</span><span>🏫 Reunión superada</span><span>🚔 Control con calma</span></div><h2>Your short report</h2><p><b>Strength:</b> '+(b1>=70?'Everyday Spanish comprehension.':'You are building practical Spanish foundations.')+'</p><p><b>Next step:</b> '+advice+'</p><p class="small">This is a fun reading, grammar and vocabulary sample, not a validated CEFR placement test. It does not assess speaking, listening or writing.</p><div class="feedbackform" style="margin-top:24px;padding:18px;background:#f4f7f7;border-radius:16px"><h2>🗣️ Help us improve!</h2><p>How likely are you to recommend this game to a friend? (1 = not at all, 10 = definitely)</p><div id="npsChoices" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px"></div><p><label for="liked"><b>What did you like?</b></label><textarea id="liked" rows="3" placeholder="Tell us what worked well..." style="width:100%;font:inherit;padding:10px;border:1px solid #ccd6da;border-radius:10px"></textarea></p><p><label for="improve"><b>What could we improve?</b></label><textarea id="improve" rows="3" placeholder="Your suggestions..." style="width:100%;font:inherit;padding:10px;border:1px solid #ccd6da;border-radius:10px"></textarea></p><p class="small">Please email Virginia your results and feedback. The button below prepares an email in your email app; review it and select Virginia as the recipient before sending.</p><button class="btn accent" onclick="sendVirginia()">✉️ Send results and feedback to Virginia</button><p id="emailHelp" class="small" aria-live="polite"></p></div><button class="btn" onclick="share()">📤 Share my report</button><button class="btn" onclick="welcome()">↻ Play again</button><p><a class="btn accent" style="display:block;text-align:center;text-decoration:none" href="https://carpemadrid.com" target="_blank" rel="noopener">🎓 Find out about our Spanish courses here →</a></p></section>';initFeedback()}
let selectedNps=0;
function initFeedback(){const choices=document.getElementById('npsChoices');if(!choices)return;for(let n=1;n<=10;n++){const b=document.createElement('button');b.type='button';b.textContent=String(n);b.setAttribute('aria-label','Recommendation score '+n+' out of 10');b.style.cssText='border:1px solid #a9b7bd;border-radius:9px;background:white;color:#142b40;padding:10px 0;font-weight:800;cursor:pointer';b.onclick=()=>{selectedNps=n;Array.from(choices.children).forEach((el,j)=>{el.style.background=j+1===n?'#ee7559':'white';el.style.color=j+1===n?'white':'#142b40';el.setAttribute('aria-pressed',String(j+1===n))})};b.setAttribute('aria-pressed','false');choices.appendChild(b)}}
function feedbackReport(){const liked=document.getElementById('liked');const improve=document.getElementById('improve');return window.summary+'\n\nGAME FEEDBACK\nRecommendation (1-10): '+(selectedNps||'Not answered')+'\nWhat I liked: '+(liked&&liked.value.trim()||'Not answered')+'\nWhat could be improved: '+(improve&&improve.value.trim()||'Not answered')}
function sendVirginia(){if(!selectedNps){document.getElementById('emailHelp').textContent='Please choose a recommendation score from 1 to 10 first.';return}const subject='CarpeMadrid Spanish game results and feedback';const body=feedbackReport();const url='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent('Hi Virginia,\n\nHere are my game results and feedback.\n\n'+body+'\n\nBest regards,\n');document.getElementById('emailHelp').textContent='Your email app should open. Add Virginia as recipient and press Send. If nothing opens, use “Share my report” to copy your results.';window.location.href=url}
async function share(){try{if(navigator.share)await navigator.share({title:'My CarpeMadrid Spanish result',text:feedbackReport()});else if(navigator.clipboard){await navigator.clipboard.writeText(feedbackReport());alert('Report copied!')}else prompt('Copy your report',feedbackReport())}catch(e){if(e.name!=='AbortError')prompt('Copy your report',window.summary)}}
try{welcome()}catch(err){document.getElementById("app").insertAdjacentHTML("beforeend", "<p role=\"alert\">Game error: "+String(err.message)+"</p>");}
</script></body></html>

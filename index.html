const qs=[["Café","El camarero dice «¿Qué te pongo?»",["¿Qué quieres pedir?","¿Dónde te sientas?","¿Cómo te llamas?"],0,"B1"],["Café","«Me pone un café con leche» es...",["una petición habitual","una queja","una despedida"],0,"B1"],["Café","«La cuenta, cuando puedas» significa...",["Quiero pagar sin prisa","Quiero otra bebida","No voy a pagar"],0,"B1"],["Café","«Este café está para chuparse los dedos» significa...",["Está buenísimo","Está frío","Es demasiado caro"],0,"B2"],["Metro","«Tienes que hacer transbordo» significa...",["Cambiar de línea","Comprar otro billete","Salir de la estación"],0,"B1"],["Metro","«Si hubiera salido antes, no habría perdido el tren» expresa...",["una situación hipotética pasada","una promesa futura","una orden"],0,"B2"],["Metro","«La línea está cortada por obras» significa...",["No funciona un tramo","El tren va más rápido","Hay descuento"],0,"B1"],["Metro","«No me aclaro con este plano» significa...",["Me resulta confuso","Lo he entendido todo","Lo he perdido"],0,"B2"],["Piso","«El alquiler incluye los gastos» significa...",["Los gastos están incluidos","Hay que pagar el doble","No hay contrato"],0,"B1"],["Piso","«Ojalá el casero arreglara la calefacción» expresa...",["un deseo","un hecho confirmado","una prohibición"],0,"B2"],["Piso","«El piso da a un patio interior» significa...",["Tiene vistas a un patio","Tiene dos plantas","No tiene ventanas"],0,"B1"],["Piso","«No es que sea caro, es que no me compensa» significa...",["No me merece la pena","Es gratis","Ya lo he comprado"],0,"B2"],["Amigos","«¿Te apuntas a unas cañas?» significa...",["¿Vienes a tomar algo?","¿Quieres estudiar?","¿Vas a correr?"],0,"B1"],["Amigos","«Me dejó plantado» significa...",["No apareció a la cita","Me regaló una planta","Llegó temprano"],0,"B2"],["Amigos","«Aunque llueva, iremos» indica...",["que iremos de todas formas","que no iremos","que ya fuimos"],0,"B1"],["Amigos","«No me hace mucha gracia» puede significar...",["No me convence","Me encanta","Me hace reír mucho"],0,"B2"],["Trabajo","«Llevo tres años trabajando aquí» significa...",["Empecé hace tres años y sigo","Trabajaré tres años","Dejé el trabajo hace tres años"],0,"B1"],["Trabajo","«Buscamos a alguien que sepa negociar» requiere subjuntivo porque...",["la persona no está identificada","hablamos del pasado","es una pregunta"],0,"B2"],["Trabajo","«En cuanto termine, te llamo» se refiere...",["al futuro","al pasado","a una rutina diaria"],0,"B2"],["Trabajo","«Por mucho que insistas, no cambiaré de opinión» significa...",["Insistir no cambiará mi decisión","Estoy de acuerdo","Quizá me convenzas fácilmente"],0,"B2"]];
let streak=0;let i=0,score=0,correctB1=0,correctB2=0,totalB1=0,totalB2=0,locked=false;
const app=document.getElementById('app');const icons=['☕','🚇','🏠','💃','💼'];const quips=['¡Ojo! En Madrid, el café es cosa seria.','No te duermas, que se va el Metro.','El casero dice que todo está perfecto… claro.','Cuidado: las cañas pueden durar seis horas.','Respira. La entrevista no muerde.'];function map(){return '<div class="map">'+icons.map((x,j)=>'<div class="stop '+(Math.floor(i/4)===j?'active':'')+'">'+x+'</div>').join('')+'</div>'}function guide(){return '<div class="guide"><span class="face">🧑🏻‍🎨</span><p><b>Tu guía, Paco:</b> '+quips[Math.min(4,Math.floor(i/4))]+'</p></div>'}
function start(){streak=0;i=0;score=0;correctB1=0;correctB2=0;totalB1=0;totalB2=0;show();}
function welcome(){app.innerHTML='<section class="card"><p class="tag">Spanish adventure · Demo MVP</p><h1>¡Sobrevive en Madrid! 🎮</h1><p>Can you survive cafés, Metro chaos, tricky landlords and awkward dates… in Spanish?</p><p>20 quick challenges · about 7 minutes · a short B1/B2 report.</p><p class="small">No login. Just you, Madrid and a little linguistic drama.</p><button class="btn accent" onclick="start()">¡Vamos! →</button></section>'}
function show(){locked=false;if(i>=qs.length)return report();let q=qs[i];let options=q[2].map((v,j)=>({v,j}));options.sort((a,b)=>((i*7+a.j*13)%11)-((i*7+b.j*13)%11));app.innerHTML=map()+guide()+'<div class="stats"><span>⭐ '+score+' XP</span><span>Pregunta '+(i+1)+' / '+qs.length+'</span></div><div class="bar"><div class="fill" style="width:'+(100*i/qs.length)+'%"></div></div><section class="card"><p class="tag">📍 '+q[0]+' · '+q[4]+'</p><h2>'+q[1]+'</h2><div id="answers"></div><div id="response" aria-live="polite"></div></section>';const box=document.getElementById('answers');options.forEach(o=>{let b=document.createElement('button');b.className='btn answer';b.textContent=o.v;b.onclick=()=>choose(o.j,b);box.appendChild(b)})}
function choose(j,button){if(locked)return;locked=true;let q=qs[i],ok=j===q[3];if(q[4]==='B1'){totalB1++;if(ok)correctB1++}else{totalB2++;if(ok)correctB2++}if(ok){streak++;score+=10+(streak>=3?5:0)}else streak=0;document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.textContent===q[2][q[3]])b.classList.add('correct')});if(!ok)button.classList.add('wrong');document.getElementById('response').innerHTML='<div class="feedback">'+(ok?'🎉 ¡Olé! +10 XP.':'😅 ¡Casi! Madrid te da otra oportunidad.')+'</div><button class="btn accent" onclick="next()">'+(i===qs.length-1?'Ver mi informe 📊':'Siguiente →')+'</button>'}
function next(){i++;show()}
function report(){let b1=totalB1?Math.round(100*correctB1/totalB1):0,b2=totalB2?Math.round(100*correctB2/totalB2):0;let level=b1<60?'Below B1 (indicative)':b2>=80&&b1>=80?'B2 (indicative)':b2>=55&&b1>=70?'B1+ / approaching B2':'B1 (indicative)';let advice=b2<60?'Practise nuanced expressions, subjunctive and hypothetical structures.':'Keep practising real-world conversations and complex opinions.';window.summary='CarpeMadrid Spanish Adventure\nResult: '+level+'\nXP: '+score+'/200\nB1: '+b1+'%\nB2: '+b2+'%\nNext step: '+advice+'\nNot an official CEFR assessment.';app.innerHTML='<section class="card"><p class="tag">Tu informe · Game complete</p><h1>🏆 ¡Enhorabuena!</h1><p>Has sobrevivido a Madrid sin perder el abono transporte. ¡Eso ya es algo!</p><p class="badge">'+level+'</p><h2>'+score+' / 200 XP</h2><p><b>B1 questions:</b> '+b1+'% correct<br><b>B2 questions:</b> '+b2+'% correct</p><h2>Medallas de Madrid</h2><div class="badgeboard"><span>☕ Café valiente</span><span>🚇 Metro survivor</span><span>🏠 Piso detective</span><span>💃 Rey de las cañas</span><span>💼 Entrevista ninja</span></div><h2>Your short report</h2><p><b>Strength:</b> '+(b1>=70?'Everyday Spanish comprehension.':'You are building practical Spanish foundations.')+'</p><p><b>Next step:</b> '+advice+'</p><p class="small">This is a fun reading, grammar and vocabulary sample, not a validated CEFR placement test. It does not assess speaking, listening or writing.</p><button class="btn accent" onclick="share()">📤 Share my report</button><button class="btn" onclick="welcome()">↻ Play again</button><p class="small">Explore <a href="https://carpemadrid.com">carpemadrid.com</a></p></section>'}
async function share(){try{if(navigator.share)await navigator.share({title:'My CarpeMadrid Spanish result',text:window.summary});else if(navigator.clipboard){await navigator.clipboard.writeText(window.summary);alert('Report copied!')}else prompt('Copy your report',window.summary)}catch(e){if(e.name!=='AbortError')prompt('Copy your report',window.summary)}}
welcome();
</script></body></html>
